<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Sorting Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Playlist Descriptions</h1>
    <div class="container">
        <div class="card">
            <h2>Your Playlist Descriptions</h2>
            <p>Here you can describe your playlists.</p>
            <!-- Playlist descriptions will be populated dynamically -->
            <div class="songlist-container">
        </div>
        <!-- A submit button and reject button next to each other -->
        <div class="submit-container" style="align-items: center; display: flex; justify-content: center; gap: 1em; margin-top: 1em;">
            <button class="submit-btn" onclick="submitDescriptions()">Submit Descriptions</button>
            <button class="reject-btn" onclick="rejectDescriptions()">Reject and Go Back</button>
        </div>
    </div>
</body>
<script>
    // This script will run when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        // fetch the song descriptions from the server and create textareas dynamically
        fetch('http://localhost:3000/playlist_descriptions')
            .then(response => response.json())
            .then(data => {
                const descriptions = data.descriptions || [];
                const container = document.querySelector('.songlist-container');
                
                // Create a textarea for each description received
                descriptions.forEach((description, index) => {
                    const listDiv = document.createElement('div');
                    listDiv.innerHTML = `<h3 class="song-description">Playlist Description ${index + 1}</h3><textarea rows="10" cols="50" placeholder="Enter description for this playlist..."></textarea>`;
                    container.appendChild(listDiv);
                    
                    // Populate the textarea with the description
                    const textarea = listDiv.querySelector('textarea');
                    textarea.value = description;
                });
            })
            .catch(error => {
                console.error('Error fetching playlist descriptions:', error);
            });
    });
    function submitDescriptions() {
        const textareas = document.querySelectorAll('.songlist-container textarea');
        const descriptions = Array.from(textareas).map(textarea => textarea.value);
        // send the descriptions to the server
        fetch('http://localhost:3000/submit_descriptions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ descriptions })
        })
        .then(response => response.json())
        .then(data => {
            console.log('Response from server:', data);
            alert('Descriptions submitted successfully!');
        })
        .catch(error => {
            console.error('Error submitting descriptions:', error);
            alert('Error submitting descriptions. Please try again.');
        });
    }

    function rejectDescriptions() {
        // if the user rejects the descriptions, go back to the prompt page
        window.location.href = 'prompt_page.html';
    }
</script>
</html>
