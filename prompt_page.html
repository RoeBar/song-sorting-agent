<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Sorting Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Prompt Page</h1>
    <div class="container">
        <div class="card">
            <h2>Welcome to the Prompt Page</h2>
            <p>This is where you can input your sorting criteria for your Spotify playlists.</p>
            <form id="prompt-form">
                <label for="criteria">Sorting Criteria:</label><br>
                <div class="textarea-wrapper">
                    <textarea id="criteria" name="criteria" placeholder="e.g., sort by tempo" rows="4" cols="50"></textarea>
                </div>
                <div class="prompt-actions" style="display: flex; gap: 1em; align-items: center; flex-wrap: wrap; margin-top: 0.75em;">
                    <button type="button" id="magic-sort-btn" class="preset-btn">Magic sort</button>
                    <input type="submit" value="Continue" class="submit-btn">
                </div>
            </form>
        </div>
    </div>
    <script src="prompt_script.js"></script>
</body>
</html>
