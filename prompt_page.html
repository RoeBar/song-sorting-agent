<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Sorting Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Prompt Page</h1>
    <div class="container">
        <div class="card">
            <h2>Welcome to the Prompt Page</h2>
            <p>This is where you can input your sorting criteria for your Spotify playlists.</p>
            <form id="prompt-form">
                <label for="criteria">Sorting Criteria:</label><br>
                <textarea id="criteria" name="criteria" placeholder="e.g., sort by tempo" rows="4" cols="50"></textarea><br><br>
                <input type="submit" value="Continue" class="submit-btn">
            </form>
        </div>
    </div>
    <script src="prompt_script.js"></script>
</body>
</html>
