<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Sorting Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Prompt Page</h1>
    <div class="container">
        <div class="card">
            <h2>Welcome to the Prompt Page</h2>
            <p>This is where you can input your sorting criteria for your Spotify playlists.</p>
            <form id="prompt-form">
                <label for="criteria">Sorting Criteria:</label><br>
                <div class="textarea-wrapper">
                    <div class="preset-components">
                        <button type="button" class="preset-btn" onclick="fillPreset('sort by tempo')">Sort by Tempo</button>
                        <button type="button" class="preset-btn" onclick="fillPreset('sort by energy')">Sort by Energy</button>
                        <button type="button" class="preset-btn" onclick="fillPreset('sort by danceability')">Sort by Danceability</button>
                    </div>
                    <textarea id="criteria" name="criteria" placeholder="e.g., sort by tempo" rows="4" cols="50"></textarea>
                </div>
                <br>
                <input type="submit" value="Continue" class="submit-btn">
            </form>
        </div>
    <script src="prompt_script.js"></script>
</body>
</html>
